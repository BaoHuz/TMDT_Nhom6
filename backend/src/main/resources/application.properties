spring.application.name=pool-booking
server.port=8080
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PoolBooking;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:aqua-flow-local-dev-secret-change-before-production-2026}
app.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.error.include-message=never
